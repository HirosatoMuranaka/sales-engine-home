<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sales Engine</title>
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-title" content="Sales Engine">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<script>
/* Sales Engine をホーム画面に新しいアイコンで置くための案内ページ。
   GASの外枠（script.google.com）には apple-touch-icon を書けないので、アイコンはこのページが持つ。
   ・初めて開いた：案内を見せ、アドレスを ?go=1 にしておく（ホーム画面に追加されるのはこの形）
   ・ホーム画面のアイコンから開いた（?go=1 で、このタブで案内を見ていない／standalone）：すぐ本番へ（?h=1＝アプリ側はすすめない）
   ・案内を見ている途中の読み直し：同じタブの印（sessionStorage）があるので飛ばない */
var APP='https://script.google.com/macros/s/AKfycbwJJ5UFXrE5y_P9lmzv5UBc463ciwsIQVaoZ5aNmwcP2yBhKtZ22oli2azzEfuhJTAdXw/exec';
var seen=false;try{seen=sessionStorage.getItem('se_guide')==='1';}catch(e){}
var GO=window.navigator.standalone===true||(/(^|[?&])go=1(&|$)/.test(location.search)&&!seen);
if(GO){location.replace(APP+'?h=1');}
else{try{sessionStorage.setItem('se_guide','1');}catch(e){}try{history.replaceState(null,'',location.pathname+'?go=1');}catch(e){}}
</script>
<style>
:root{--bg:#F3F5F8;--card:#fff;--ink:#181818;--sub:#555;--mut:#767676;--rule:#E3E7ED;--brand:#0176D3;--warn:#FEF3C7;--warnink:#8a4b08}
@media (prefers-color-scheme:dark){:root{--bg:#0F0F0F;--card:#1a1a1a;--ink:#EAEAEA;--sub:#c4c4c4;--mut:#9a9a9a;--rule:#2c2c2c;--brand:#4AA3F0;--warn:#3a2a08;--warnink:#f5c46b;color-scheme:dark}}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:440px;margin:0 auto;padding:calc(32px + env(safe-area-inset-top,0px)) 16px calc(56px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:20px}
.icon{width:88px;height:88px;border-radius:20px;box-shadow:0 6px 20px rgba(1,68,134,.18)}
h1{font-size:21px;line-height:1.4;margin:0;text-align:center}
.lead{margin:6px 0 0;text-align:center;color:var(--sub);font-size:14px}
.nw{display:inline-block}
ol{list-style:none;margin:0;padding:0;width:100%;display:flex;flex-direction:column;gap:10px}
li{display:grid;grid-template-columns:30px 1fr;gap:12px;align-items:start;background:var(--card);border:1px solid var(--rule);border-radius:16px;padding:14px}
.n{width:30px;height:30px;border-radius:50%;background:var(--brand);color:#fff;font-weight:700;display:grid;place-items:center}
li b{display:block;font-size:16px;line-height:1.45}
li span.d{display:block;font-size:13px;color:var(--sub);margin-top:2px}
.share{display:inline-block;width:20px;height:20px;vertical-align:-4px;margin:0 2px;color:var(--brand)}
.note{width:100%;background:var(--warn);color:var(--warnink);border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.6}
.note b{display:block;font-size:15px}
.open{display:flex;align-items:center;justify-content:center;min-height:44px;padding:0 12px;font-size:14px;color:var(--brand);font-weight:600;text-decoration:none}
.arrow{position:fixed;left:50%;bottom:calc(6px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);color:var(--brand);animation:b 1.2s ease-in-out infinite;pointer-events:none}
@keyframes b{50%{transform:translate(-50%,6px)}}
@media (max-height:700px){.arrow{display:none}}
[hidden]{display:none!important}

</style>
</head>
<body>
<div class="wrap">
  
  <img class="icon" src="apple-touch-icon.png" alt="Sales Engine のアイコン">
  <div><h1><span class="nw">Sales Engine を</span><span class="nw">ホーム画面に追加</span></h1>
  <p class="lead"><span class="nw">追加すると、アイコンから</span><span class="nw">すぐ開けるようになります。</span></p></div>
  <div class="note" id="inapp" hidden><b>この画面からは追加できません</b><span class="nw">右上（または右下）のメニューから</span><span class="nw">「Safariで開く」を選んでください。</span></div>
  <ol id="steps">
    <li><span class="n">1</span><div><b><span class="nw">共有ボタン<svg class="share" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M8 7l4-4 4 4"/><path d="M6 11H5a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-8a1 1 0 0 0-1-1h-1"/></svg>を</span><span class="nw">押す</span></b><span class="d" id="where">画面の下にあります。見当たらないときは右下の「…」→「共有」。</span></div></li>
    <li><span class="n">2</span><div><b><span class="nw">「ホーム画面に追加」を</span><span class="nw">押す</span></b><span class="d">出てこないときは、メニューを下へスクロールします。</span></div></li>
    <li><span class="n">3</span><div><b><span class="nw">右上の「追加」を</span><span class="nw">押す</span></b><span class="d">このアイコンがホーム画面に出れば完了です。</span></div></li>
  </ol>
  <a class="open" href="https://script.google.com/macros/s/AKfycbwJJ5UFXrE5y_P9lmzv5UBc463ciwsIQVaoZ5aNmwcP2yBhKtZ22oli2azzEfuhJTAdXw/exec?h=0">追加せずに Sales Engine を開く</a>
</div>
<svg class="arrow" id="arrow" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v15M6 13l6 6 6-6"/></svg>
<script>
/* 共有ボタンの場所は、ブラウザと機種で違う */
(function(){
  var ua=navigator.userAgent;
  var iPad=/iPad/.test(ua)||(/Macintosh/.test(ua)&&navigator.maxTouchPoints>1);
  var inApp=/\bLine\/|FBAN|FBAV|Instagram|KAKAOTALK|MicroMessenger|GSA\//i.test(ua);
  var other=/CriOS|FxiOS|EdgiOS/.test(ua);
  var where=document.getElementById('where'),arrow=document.getElementById('arrow');
  if(inApp){document.getElementById('inapp').hidden=false;document.getElementById('steps').hidden=true;arrow.style.display='none';return;}
  if(other){where.textContent='アドレス欄の右側にあります。';arrow.style.display='none';}
  else if(iPad){where.textContent='画面の右上にあります。';arrow.style.display='none';}
})();
</script>
</body>
</html>
